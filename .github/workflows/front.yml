name: Front

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  jornada:
    # Portão da fase C (docs/mvp-resposta-rfp/plan/PLAN.md): a jornada inteira no navegador, com a API simulada.
    name: Build e jornada de ponta a ponta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-da-jornada
          path: |
            playwright-report/
            test-results/
          retention-days: 7
