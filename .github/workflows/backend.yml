name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "base-sintetica/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "base-sintetica/**"
      - ".github/workflows/backend.yml"

# Um novo push no mesmo PR cancela a execução anterior; na main, as execuções vão até o fim.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  testes:
    name: Tipos e testes do backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  testes-postgres:
    name: Testes do backend no Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Mesma suíte, com cada teste de integração num esquema próprio do Postgres (etapa D1).
      - run: npm test
        env:
          TENDRA_TESTE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
