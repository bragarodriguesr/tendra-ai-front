<!-- @dsCard group="Gradients" viewport="700x250" name="Dados sobre a luz" subtitle="O campo é de marca; o dado fica em painel chapado" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; background: var(--surface-page); }
    * { box-sizing: border-box; }
    body { font-family: var(--font-sans); color: var(--text-body); padding: 18px 22px; }
    .g { display: grid; gap: 10px; }
    .cap { font-family: var(--font-mono); font-size: 10px; line-height: 1.5; letter-spacing: 0.06em; color: var(--text-meta); }
    .nm { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--text-strong); }

  </style>
</head>
<body>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
  <div style="border-radius: var(--radius-xl); padding: 18px; background: var(--grad-aurora-ink); display: grid; gap: 12px; align-content: start">
    <div class="cap" style="color: var(--ink-200)">FAÇA · PAINEL SOBRE O CAMPO</div>
    <div style="background: rgba(245,246,241,0.07); border: 1px solid rgba(245,246,241,0.14); border-radius: var(--radius-lg); padding: 14px; display: grid; gap: 8px">
      <div style="font-size: 13.5px; line-height: 1.55; color: var(--n-075)">AES-256 em repouso, chaves em HSM com rotação a cada 90 dias.</div>
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-200)">↳ Security_Whitepaper_v4.pdf · p.12</div>
    </div>
  </div>
  <div style="border-radius: var(--radius-xl); padding: 18px; background: var(--grad-aurora-lime); display: grid; gap: 12px; align-content: start; border-top: 3px solid var(--danger)">
    <div class="cap" style="color: var(--danger)">NÃO FAÇA · TEXTO CORRIDO SOBRE LIMÃO SATURADO</div>
    <div style="font-size: 13px; line-height: 1.5; color: var(--text-strong)">Ao alcance do brilho, o contraste varia. Dado de produto e parágrafo longo ficam em superfície chapada.</div>
  </div>
</div>
</body>
</html>
