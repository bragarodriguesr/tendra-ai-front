<!-- @dsCard group="Gradients" viewport="700x220" name="Anatomia da Aurora Limão" subtitle="Três manchas e uma base — a posição é a receita" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; background: var(--surface-page); }
    * { box-sizing: border-box; }
    body { font-family: var(--font-sans); color: var(--text-body); padding: 18px 22px; }
    .g { display: grid; gap: 10px; }
    .cap { font-family: var(--font-mono); font-size: 10px; line-height: 1.5; letter-spacing: 0.06em; color: var(--text-meta); }
    .nm { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--text-strong); }

  </style>
</head>
<body>
<div style="display: flex; gap: 22px; align-items: center">
  <div style="width: 220px; height: 170px; flex: none; border-radius: var(--radius-lg); background: var(--grad-aurora-lime); position: relative">
    <span style="position: absolute; left: 10px; bottom: 10px; width: 10px; height: 10px; border-radius: 99px; background: var(--brand-ink)"></span>
    <span style="position: absolute; right: 10px; top: 10px; width: 10px; height: 10px; border-radius: 99px; background: var(--brand-ink)"></span>
    <span style="position: absolute; right: 10px; bottom: 10px; width: 10px; height: 10px; border-radius: 99px; background: var(--brand-ink)"></span>
  </div>
  <div class="g" style="gap: 9px">
    <div class="cap"><b style="color: var(--text-strong)">1 · LIMÃO</b> — baixo à esquerda, 62×72%, some a 72%. É o único ponto saturado.</div>
    <div class="cap"><b style="color: var(--text-strong)">2 · PAPEL</b> — alto à direita. Abre espaço para o título e o logo.</div>
    <div class="cap"><b style="color: var(--text-strong)">3 · SÁLVIA CLARA</b> — canto inferior direito, #A4AA98. Esfria o limão sem outra cor.</div>
    <div class="cap"><b style="color: var(--text-strong)">BASE</b> — #E7EFBC (limão a 25% sobre papel). Nunca branco puro.</div>
  </div>
</div>
</body>
</html>
